<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Ponto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⏱ Sistema de Ponto</h1>

<div class="card">
  <input type="text" id="nome" placeholder="Nome do funcionário">
  <button onclick="baterPonto('Entrada')">Entrada</button>
  <button onclick="baterPonto('Almoço')">Saída Almoço</button>
  <button onclick="baterPonto('Volta')">Volta Almoço</button>
  <button onclick="baterPonto('Saída')">Saída</button>
</div>

<div class="card">
  <h2>Registros</h2>
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Tipo</th>
        <th>Data</th>
        <th>Hora</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<div class="card">
  <button class="danger" onclick="limpar()">Limpar Demonstração</button>
</div>

<script src="script.js"></script>
</body>
</html>
